name: Dev private Claude image

on:
  push:
    branches:
      - dev/acp-mcp-ttl-image
    paths:
      - .github/workflows/dev-ephemeral-claude-image.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile.claude
      - crates/**
      - src/**

permissions:
  contents: read

env:
  IMAGE: ghcr.io/canyugs/openab-octobroker-canary:0ae5d9b

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push private amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.claude
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=snapshot-claude-linux/amd64

      - name: Record image
        run: echo "\`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
