name: Dev ephemeral Claude image

on:
  push:
    branches:
      - dev/acp-mcp-ttl-image
    paths:
      - .github/workflows/dev-ephemeral-claude-image.yml
      - Cargo.lock
      - Cargo.toml
      - Dockerfile.claude
      - crates/**
      - src/**

permissions:
  contents: read

env:
  IMAGE: ttl.sh/canyugs-openab-acp-canary-6a622fb9:6h

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - name: Build and push one-shot amd64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.claude
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
          cache-from: type=gha,scope=snapshot-claude-linux/amd64
          cache-to: type=gha,scope=octobroker-canary-linux-amd64,mode=max

      - name: Record image
        run: echo "\`${IMAGE}\`" >> "$GITHUB_STEP_SUMMARY"
